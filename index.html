<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b2f23"><meta name="description" content="Turrones y dulces artesanales"><title>Dulces artesanales</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><strong>Dulces artesanales</strong><small>Hechos con cariño</small></div><button id="cartBtn" class="cart">Carrito <span id="cartCount">0</span></button></header>
<main><section class="hero"><div><p class="eyebrow">EL SABOR DE SIEMPRE</p><h1>Turrones y dulces artesanales</h1><p>Elige producto, tamaño o formato y prepara tu pedido.</p><a href="#catalogo" class="primary">Ver catálogo</a></div></section>
<section id="catalogo" class="section"><div class="section-head"><div><p class="eyebrow">CATÁLOGO</p><h2>Nuestros productos</h2></div><div id="filters" class="filters"><button class="active" data-filter="Todos">Todos</button><button data-filter="Turrón">Turrones</button><button data-filter="Polvorón">Polvorones</button><button data-filter="Mantecado">Mantecados</button></div></div><div id="status" class="status">Cargando catálogo…</div><div id="products" class="grid"></div></section></main>
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="panel"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div>
<div id="cartDrawer" class="overlay hidden"><div class="drawer"><div class="drawer-head"><h2>Tu pedido</h2><button class="close" id="closeCart">×</button></div><div id="cartItems"></div><div class="total"><span>Total</span><strong id="cartTotal">0,00 €</strong></div><button id="checkoutBtn" class="primary full">Continuar pedido</button></div></div>
<div id="checkout" class="overlay hidden"><div class="panel checkout"><button class="close" id="closeCheckout">×</button><h2>Finalizar pedido</h2><form id="orderForm"><label>Nombre*<input name="nombre_cliente" required maxlength="100"></label><label>Teléfono*<input name="telefono" required maxlength="30"></label><label>Email<input name="email" type="email" maxlength="150"></label><label>Método de entrega<select name="metodo_entrega"><option>Recogida</option><option>Entrega local</option></select></label><div id="addressFields" class="two"><label>Dirección<input name="direccion" maxlength="200"></label><label>Población<input name="poblacion" maxlength="100"></label></div><label>Método de pago<select name="metodo_pago"><option>Bizum</option><option>Efectivo</option><option>Transferencia</option></select></label><label>Notas<textarea name="notas_cliente" maxlength="500"></textarea></label><label class="check"><input type="checkbox" name="consentimiento" required> Acepto que mis datos se usen para gestionar el pedido.</label><button class="primary full" type="submit">Confirmar pedido</button><p id="formStatus" class="status"></p></form></div></div>
<script src="app.js"></script></body></html>
